name: Build

# Produces an installable VST3 (and the standalone) for each platform.
# Download them from the "Artifacts" section of a finished run, or, for a
# tagged build, from the release the last job attaches them to.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxrender-dev libglu1-mesa-dev

      # No JUCE_PATH, so CMake fetches JUCE 8.0.4 at configure time.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          # Plugin bundles are directories on every platform, so copy recursively.
          find build/DirtyBass_artefacts -maxdepth 3 \
               \( -name "*.vst3" -o -name "*.component" \) -print0 \
            | xargs -0 -I{} cp -R {} dist/
          ls -R dist

      # Zip on the build runner rather than letting upload-artifact do it: the
      # artifact upload drops the executable bit and flattens symlinks, which a
      # macOS bundle needs kept, so the zip attached to a release is the one
      # that was actually built.
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../DirtyBass-${{ matrix.name }}.zip" ./*
          else
            zip -r -y "../DirtyBass-${{ matrix.name }}.zip" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DirtyBass-${{ matrix.name }}
          path: DirtyBass-${{ matrix.name }}.zip
          if-no-files-found: error

  # Only on a v* tag, and only once the builds are green: collect the zips and
  # hang them off a release, so there is a permanent download that does not
  # expire and does not ask for a GitHub sign-in.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Collect the zips
        run: |
          mkdir -p dist
          find artefacts -name '*.zip' -exec mv {} dist/ \;
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running a tagged build replaces the assets rather than failing.
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "Dirty Bass $GITHUB_REF_NAME" \
              --generate-notes
          fi
